name: Prepare due follow-ups in staging

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: prepare-due-followups-staging
  cancel-in-progress: false

env:
  PROJECT_ID: medlivo-ai-platform
  REGION: us-west1
  FOLLOWUP_JOB: medlivo-followup-due-staging

jobs:
  prepare:
    if: github.repository == 'pks-alt/Medlivo-AI-Platform'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Execute due follow-up preparation
        run: |
          set -euo pipefail
          gcloud run jobs execute "${FOLLOWUP_JOB}"             --project="${PROJECT_ID}"             --region="${REGION}"             --wait             --quiet
