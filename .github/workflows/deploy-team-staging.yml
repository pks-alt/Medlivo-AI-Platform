name: Deploy private team staging

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-team-staging.yml"
      - "apps/recruiter-web/**"
      - "services/team-workspace/**"
      - "services/margin-engine/**"
      - "infrastructure/team-staging/**"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-private-team-staging
  cancel-in-progress: false

env:
  PROJECT_ID: medlivo-ai-platform
  REGION: us-west1
  GAR_REPOSITORY: medlivo-ai-containers
  API_SERVICE: medlivo-team-api-staging
  WEB_SERVICE: medlivo-team-web-staging

jobs:
  deploy:
    if: github.repository == 'pks-alt/Medlivo-AI-Platform'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Configure Artifact Registry
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Build and push private API
        run: |
          API_IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${GAR_REPOSITORY}/${API_SERVICE}:${GITHUB_SHA}"
          docker build -f infrastructure/team-staging/Dockerfile.api -t "${API_IMAGE}" .
          docker push "${API_IMAGE}"
          echo "API_IMAGE=${API_IMAGE}" >> "${GITHUB_ENV}"

      - name: Deploy private API candidate with schema readiness gate
        run: |
          gcloud run deploy "${API_SERVICE}" \
            --project="${PROJECT_ID}" \
            --region="${REGION}" \
            --image="${API_IMAGE}" \
            --no-traffic \
            --startup-probe="httpGet.path=/ready,httpGet.port=8080,timeoutSeconds=3,periodSeconds=5,failureThreshold=6" \
            --no-log-http \
            --quiet

      - name: Promote schema-ready private API revision
        run: |
          gcloud run services update-traffic "${API_SERVICE}" \
            --project="${PROJECT_ID}" \
            --region="${REGION}" \
            --to-latest \
            --quiet

      - name: Build and push private team web
        run: |
          WEB_IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${GAR_REPOSITORY}/${WEB_SERVICE}:${GITHUB_SHA}"
          docker build -f apps/recruiter-web/Dockerfile -t "${WEB_IMAGE}" apps/recruiter-web
          docker push "${WEB_IMAGE}"
          echo "WEB_IMAGE=${WEB_IMAGE}" >> "${GITHUB_ENV}"

      - name: Deploy private web image only
        run: |
          gcloud run services update "${WEB_SERVICE}"             --project="${PROJECT_ID}"             --region="${REGION}"             --image="${WEB_IMAGE}"             --no-log-http             --quiet

      - name: Show deployed revisions
        run: |
          gcloud run services describe "${API_SERVICE}" --project="${PROJECT_ID}" --region="${REGION}" --format='value(status.latestReadyRevisionName,status.url)'
          gcloud run services describe "${WEB_SERVICE}" --project="${PROJECT_ID}" --region="${REGION}" --format='value(status.latestReadyRevisionName,status.url)'

      - name: Show non-secret staging routing configuration
        run: |
          WEB_ORIGIN="$(gcloud run services describe "${WEB_SERVICE}" --project="${PROJECT_ID}" --region="${REGION}" --format=json | jq -r '.spec.template.spec.containers[0].env[]? | select(.name=="TEAM_APP_ORIGIN") | .value // empty')"
          API_ORIGIN="$(gcloud run services describe "${WEB_SERVICE}" --project="${PROJECT_ID}" --region="${REGION}" --format=json | jq -r '.spec.template.spec.containers[0].env[]? | select(.name=="TEAM_API_URL") | .value // empty')"
          WORKSPACE_ENABLED="$(gcloud run services describe "${WEB_SERVICE}" --project="${PROJECT_ID}" --region="${REGION}" --format=json | jq -r '.spec.template.spec.containers[0].env[]? | select(.name=="TEAM_WORKSPACE_ENABLED") | .value // empty')"
          WEB_CLIENT_ID="$(gcloud run services describe "${WEB_SERVICE}" --project="${PROJECT_ID}" --region="${REGION}" --format=json | jq -r '.spec.template.spec.containers[0].env[]? | select(.name=="TEAM_GOOGLE_CLIENT_ID") | .value // empty')"
          API_CLIENT_ID="$(gcloud run services describe "${API_SERVICE}" --project="${PROJECT_ID}" --region="${REGION}" --format=json | jq -r '.spec.template.spec.containers[0].env[]? | select(.name=="WORKSPACE_GOOGLE_CLIENT_ID") | .value // empty')"
          WEB_DOMAIN="$(gcloud run services describe "${WEB_SERVICE}" --project="${PROJECT_ID}" --region="${REGION}" --format=json | jq -r '.spec.template.spec.containers[0].env[]? | select(.name=="TEAM_GOOGLE_HOSTED_DOMAIN") | .value // empty')"
          API_DOMAIN="$(gcloud run services describe "${API_SERVICE}" --project="${PROJECT_ID}" --region="${REGION}" --format=json | jq -r '.spec.template.spec.containers[0].env[]? | select(.name=="WORKSPACE_GOOGLE_HOSTED_DOMAIN") | .value // empty')"
          CLIENT_ID_MATCH=false
          if [ -n "${WEB_CLIENT_ID}" ] && [ "${WEB_CLIENT_ID}" = "${API_CLIENT_ID}" ]; then CLIENT_ID_MATCH=true; fi
          DOMAIN_MATCH=false
          if [ -n "${WEB_DOMAIN}" ] && [ "${WEB_DOMAIN}" = "${API_DOMAIN}" ]; then DOMAIN_MATCH=true; fi
          printf 'TEAM_APP_ORIGIN=%s\nTEAM_API_URL=%s\nTEAM_WORKSPACE_ENABLED=%s\nOAUTH_CLIENT_IDS_CONFIGURED=%s\nOAUTH_CLIENT_IDS_MATCH=%s\nOAUTH_DOMAINS_MATCH=%s\nEXPECTED_REDIRECT_URI=%s/api/team/auth/callback\n'             "${WEB_ORIGIN}" "${API_ORIGIN}" "${WORKSPACE_ENABLED}" "$([ -n "${WEB_CLIENT_ID}" ] && [ -n "${API_CLIENT_ID}" ] && echo true || echo false)" "${CLIENT_ID_MATCH}" "${DOMAIN_MATCH}" "${WEB_ORIGIN}"
