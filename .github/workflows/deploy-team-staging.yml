# Redeploy trigger: standards-driven job intake rollout
name: Deploy private team staging

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-team-staging.yml"
      - "apps/recruiter-web/**"
      - "services/team-workspace/**"
      - "services/margin-engine/**"
      - "infrastructure/team-staging/**"
  workflow_dispatch:
    inputs:
      diagnostics_only:
        description: "Read migration metadata only; no builds, migrations or deployment"
        type: boolean
        default: true
        required: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-private-team-staging
  cancel-in-progress: false

env:
  PROJECT_ID: medlivo-ai-platform
  REGION: us-west1
  GAR_REPOSITORY: medlivo-ai-containers
  API_SERVICE: medlivo-team-api-staging
  WEB_SERVICE: medlivo-team-web-staging

jobs:
  deploy:
    if: github.repository == 'pks-alt/Medlivo-AI-Platform'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Verify staging migration identity
        run: python3 infrastructure/team-staging/migration_preflight.py --inventory

      - name: Configure Artifact Registry
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.diagnostics_only }}
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Build and push private API
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.diagnostics_only }}
        run: |
          API_IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${GAR_REPOSITORY}/${API_SERVICE}:${GITHUB_SHA}"
          docker build -f infrastructure/team-staging/Dockerfile.api -t "${API_IMAGE}" .
          docker push "${API_IMAGE}"
          echo "API_IMAGE=${API_IMAGE}" >> "${GITHUB_ENV}"

      - name: Apply reviewed workspace migrations 014-022
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.diagnostics_only }}
        run: |
          set -euo pipefail
          MIGRATION_JOB="medlivo-team-schema-staging"
          MIGRATION_SA="medlivo-team-schema-staging@${PROJECT_ID}.iam.gserviceaccount.com"
          for MIGRATION in \
            014_job_content_standards.sql \
            015_recruiter_execution_controls.sql \
            016_outreach_drafts.sql \
            017_outreach_execution.sql \
            018_gmail_provider_pilot.sql \
            019_gmail_reply_sync.sql \
            020_followup_sequences.sql \
            021_scheduled_followup_execution.sql \
            022_repair_recruiter_execution_controls.sql
          do
            echo "Applying reviewed migration ${MIGRATION}"
            gcloud run jobs deploy "${MIGRATION_JOB}" \
              --project="${PROJECT_ID}" \
              --region="${REGION}" \
              --image="${API_IMAGE}" \
              --service-account="${MIGRATION_SA}" \
              --set-cloudsql-instances="${PROJECT_ID}:${REGION}:medlivo-ai-postgres" \
              --set-secrets="WORKSPACE_DATABASE_URL=medlivo-team-staging-migration-database-url:latest" \
              --command="python" \
              --args="-m,workspace_api.migrate,/app/migrations/${MIGRATION}" \
              --max-retries=0 \
              --task-timeout=300s \
              --quiet
            if ! gcloud run jobs execute "${MIGRATION_JOB}" \
              --project="${PROJECT_ID}" \
              --region="${REGION}" \
              --wait \
              --quiet; then
              echo "::error::Migration execution failed for ${MIGRATION}. Safe database diagnostic follows if available."
              gcloud logging read \
                "resource.type=\"cloud_run_job\" AND resource.labels.job_name=\"${MIGRATION_JOB}\" AND textPayload:\"MIGRATION_FAILED name=${MIGRATION}\"" \
                --project="${PROJECT_ID}" \
                --freshness=15m \
                --limit=5 \
                --format='value(textPayload)' \
                --quiet || true
              exit 1
            fi
          done

      - name: Deploy private API candidate with schema readiness gate
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.diagnostics_only }}
        run: |
          gcloud run deploy "${API_SERVICE}" \
            --project="${PROJECT_ID}" \
            --region="${REGION}" \
            --image="${API_IMAGE}" \
            --update-env-vars="MEDLIVO_RELEASE_SHA=${GITHUB_SHA}" \
            --no-traffic \
            --startup-probe="httpGet.path=/ready,httpGet.port=8080,timeoutSeconds=3,periodSeconds=5,failureThreshold=6" \
            --no-log-http \
            --quiet

      - name: Promote schema-ready private API revision
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.diagnostics_only }}
        run: |
          gcloud run services update-traffic "${API_SERVICE}" \
            --project="${PROJECT_ID}" \
            --region="${REGION}" \
            --to-latest \
            --quiet

      - name: Deploy automatic due follow-up preparation job
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.diagnostics_only }}
        run: |
          set -euo pipefail
          FOLLOWUP_JOB="medlivo-followup-due-staging"
          API_SA="$(gcloud run services describe "${API_SERVICE}" --project="${PROJECT_ID}" --region="${REGION}" --format='value(spec.template.spec.serviceAccountName)')"
          API_DB_SECRET="$(gcloud run services describe "${API_SERVICE}" --project="${PROJECT_ID}" --region="${REGION}" --format=json | jq -r '.spec.template.spec.containers[0].env[]? | select(.name=="WORKSPACE_DATABASE_URL") | .valueFrom.secretKeyRef | if .name then (.name + ":" + (.key|tostring)) else empty end')"
          OUTREACH_PROJECT="$(gcloud run services describe "${API_SERVICE}" --project="${PROJECT_ID}" --region="${REGION}" --format=json | jq -r '.spec.template.spec.containers[0].env[]? | select(.name=="WORKSPACE_OUTREACH_AI_PROJECT") | .value // empty')"
          OUTREACH_LOCATION="$(gcloud run services describe "${API_SERVICE}" --project="${PROJECT_ID}" --region="${REGION}" --format=json | jq -r '.spec.template.spec.containers[0].env[]? | select(.name=="WORKSPACE_OUTREACH_AI_LOCATION") | .value // "global"')"
          OUTREACH_MODEL="$(gcloud run services describe "${API_SERVICE}" --project="${PROJECT_ID}" --region="${REGION}" --format=json | jq -r '.spec.template.spec.containers[0].env[]? | select(.name=="WORKSPACE_OUTREACH_AI_MODEL") | .value // empty')"
          if [ -z "${API_SA}" ] || [ -z "${API_DB_SECRET}" ] || [ -z "${OUTREACH_PROJECT}" ] || [ -z "${OUTREACH_MODEL}" ]; then
            echo "::error::Follow-up worker requires the existing API service account and outreach AI configuration."
            exit 1
          fi
          gcloud run jobs deploy "${FOLLOWUP_JOB}" \
            --project="${PROJECT_ID}" \
            --region="${REGION}" \
            --image="${API_IMAGE}" \
            --service-account="${API_SA}" \
            --set-cloudsql-instances="${PROJECT_ID}:${REGION}:medlivo-ai-postgres" \
            --set-secrets="WORKSPACE_DATABASE_URL=${API_DB_SECRET}" \
            --set-env-vars="WORKSPACE_OUTREACH_AI_PROJECT=${OUTREACH_PROJECT},WORKSPACE_OUTREACH_AI_LOCATION=${OUTREACH_LOCATION},WORKSPACE_OUTREACH_AI_MODEL=${OUTREACH_MODEL}" \
            --command="python" \
            --args="-m,workspace_api.followup_worker" \
            --max-retries=1 \
            --task-timeout=300s \
            --quiet

      - name: Build and push private team web
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.diagnostics_only }}
        run: |
          WEB_IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${GAR_REPOSITORY}/${WEB_SERVICE}:${GITHUB_SHA}"
          docker build -f apps/recruiter-web/Dockerfile -t "${WEB_IMAGE}" apps/recruiter-web
          docker push "${WEB_IMAGE}"
          echo "WEB_IMAGE=${WEB_IMAGE}" >> "${GITHUB_ENV}"

      - name: Deploy private web image only
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.diagnostics_only }}
        run: |
          gcloud run services update "${WEB_SERVICE}"             --project="${PROJECT_ID}"             --region="${REGION}"             --image="${WEB_IMAGE}"             --update-env-vars="MEDLIVO_RELEASE_SHA=${GITHUB_SHA}"             --no-log-http             --quiet

      - name: Show deployed revisions
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.diagnostics_only }}
        run: |
          gcloud run services describe "${API_SERVICE}" --project="${PROJECT_ID}" --region="${REGION}" --format='value(status.latestReadyRevisionName,status.url)'
          gcloud run services describe "${WEB_SERVICE}" --project="${PROJECT_ID}" --region="${REGION}" --format='value(status.latestReadyRevisionName,status.url)'

      - name: Verify deployed release SHA
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.diagnostics_only }}
        run: |
          API_SHA="$(gcloud run services describe "${API_SERVICE}" --project="${PROJECT_ID}" --region="${REGION}" --format=json | jq -r '.spec.template.spec.containers[0].env[]? | select(.name=="MEDLIVO_RELEASE_SHA") | .value // empty')"
          WEB_SHA="$(gcloud run services describe "${WEB_SERVICE}" --project="${PROJECT_ID}" --region="${REGION}" --format=json | jq -r '.spec.template.spec.containers[0].env[]? | select(.name=="MEDLIVO_RELEASE_SHA") | .value // empty')"
          if [ "${API_SHA}" != "${GITHUB_SHA}" ] || [ "${WEB_SHA}" != "${GITHUB_SHA}" ]; then
            echo "::error::Staging release SHA mismatch. API=${API_SHA} WEB=${WEB_SHA} expected=${GITHUB_SHA}"
            exit 1
          fi
          echo "STAGING_RELEASE_SHA=${GITHUB_SHA}"

      - name: Show non-secret staging routing configuration
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.diagnostics_only }}
        run: |
          WEB_ORIGIN="$(gcloud run services describe "${WEB_SERVICE}" --project="${PROJECT_ID}" --region="${REGION}" --format=json | jq -r '.spec.template.spec.containers[0].env[]? | select(.name=="TEAM_APP_ORIGIN") | .value // empty')"
          API_ORIGIN="$(gcloud run services describe "${WEB_SERVICE}" --project="${PROJECT_ID}" --region="${REGION}" --format=json | jq -r '.spec.template.spec.containers[0].env[]? | select(.name=="TEAM_API_URL") | .value // empty')"
          WORKSPACE_ENABLED="$(gcloud run services describe "${WEB_SERVICE}" --project="${PROJECT_ID}" --region="${REGION}" --format=json | jq -r '.spec.template.spec.containers[0].env[]? | select(.name=="TEAM_WORKSPACE_ENABLED") | .value // empty')"
          WEB_CLIENT_ID="$(gcloud run services describe "${WEB_SERVICE}" --project="${PROJECT_ID}" --region="${REGION}" --format=json | jq -r '.spec.template.spec.containers[0].env[]? | select(.name=="TEAM_GOOGLE_CLIENT_ID") | .value // empty')"
          API_CLIENT_ID="$(gcloud run services describe "${API_SERVICE}" --project="${PROJECT_ID}" --region="${REGION}" --format=json | jq -r '.spec.template.spec.containers[0].env[]? | select(.name=="WORKSPACE_GOOGLE_CLIENT_ID") | .value // empty')"
          WEB_DOMAIN="$(gcloud run services describe "${WEB_SERVICE}" --project="${PROJECT_ID}" --region="${REGION}" --format=json | jq -r '.spec.template.spec.containers[0].env[]? | select(.name=="TEAM_GOOGLE_HOSTED_DOMAIN") | .value // empty')"
          API_DOMAIN="$(gcloud run services describe "${API_SERVICE}" --project="${PROJECT_ID}" --region="${REGION}" --format=json | jq -r '.spec.template.spec.containers[0].env[]? | select(.name=="WORKSPACE_GOOGLE_HOSTED_DOMAIN") | .value // empty')"
          CLIENT_ID_MATCH=false
          if [ -n "${WEB_CLIENT_ID}" ] && [ "${WEB_CLIENT_ID}" = "${API_CLIENT_ID}" ]; then CLIENT_ID_MATCH=true; fi
          DOMAIN_MATCH=false
          if [ -n "${WEB_DOMAIN}" ] && [ "${WEB_DOMAIN}" = "${API_DOMAIN}" ]; then DOMAIN_MATCH=true; fi
          printf 'TEAM_APP_ORIGIN=%s\nTEAM_API_URL=%s\nTEAM_WORKSPACE_ENABLED=%s\nOAUTH_CLIENT_IDS_CONFIGURED=%s\nOAUTH_CLIENT_IDS_MATCH=%s\nOAUTH_DOMAINS_MATCH=%s\nEXPECTED_REDIRECT_URI=%s/api/team/auth/callback\n'             "${WEB_ORIGIN}" "${API_ORIGIN}" "${WORKSPACE_ENABLED}" "$([ -n "${WEB_CLIENT_ID}" ] && [ -n "${API_CLIENT_ID}" ] && echo true || echo false)" "${CLIENT_ID_MATCH}" "${DOMAIN_MATCH}" "${WEB_ORIGIN}"
