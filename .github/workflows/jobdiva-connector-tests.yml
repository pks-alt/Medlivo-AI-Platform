name: Test JobDiva connector

on:
  pull_request:
    paths:
      - "services/jobdiva-connector/**"
      - ".github/workflows/jobdiva-connector-tests.yml"
  push:
    branches:
      - "feat/private-team-workspace-20261005"
    paths:
      - "services/jobdiva-connector/**"
      - ".github/workflows/jobdiva-connector-tests.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: services/jobdiva-connector
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install connector test dependencies
        run: python -m pip install --disable-pip-version-check ".[test]"
      - name: Run connector tests
        run: pytest -q
