name: Test read-only JobDiva connector
on:
  pull_request:
    paths:
      - 'services/jobdiva-connector/**'
      - '.github/workflows/jobdiva-connector-tests.yml'
  push:
    branches: [main]
    paths:
      - 'services/jobdiva-connector/**'
      - '.github/workflows/jobdiva-connector-tests.yml'
permissions:
  contents: read
jobs:
  test-connector:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ['3.12', '3.13']
    defaults:
      run:
        working-directory: services/jobdiva-connector
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install connector
        run: python -m pip install .
      - name: Run synthetic tests without credentials
        env:
          JOBDIVA_LIVE_ENABLED: 'false'
        run: python -m unittest discover -s tests -v
      - name: Check Python compilation
        run: python -m compileall -q jobdiva_connector
