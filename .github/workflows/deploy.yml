name: Deploy Medlivo AI Platform
# Bootstrap test trigger

on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "apps/recruiter-web/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: medlivo-ai-platform
  REGION: us-west1
  GAR_REPOSITORY: medlivo-ai-containers
  API_SERVICE: medlivo-ai-api
  WEB_SERVICE: medlivo-recruit-web

jobs:
  deploy-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Configure Artifact Registry
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Build and push API
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${GAR_REPOSITORY}/${API_SERVICE}:${GITHUB_SHA}"
          docker build -t "${IMAGE}" apps/api
          docker push "${IMAGE}"

      - id: deploy
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: ${{ env.API_SERVICE }}
          region: ${{ env.REGION }}
          project_id: ${{ env.PROJECT_ID }}
          image: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/${{ env.API_SERVICE }}:${{ github.sha }}
          flags: >-
            --service-account=medlivo-ai-api@medlivo-ai-platform.iam.gserviceaccount.com
            --add-cloudsql-instances=medlivo-ai-platform:us-west1:medlivo-ai-postgres
            --set-secrets=DATABASE_URL=medlivo-ai-database-url:latest
            --set-env-vars=USE_MOCK_DATA=false,ENVIRONMENT=development

      - name: Show API URL
        run: echo "${{ steps.deploy.outputs.url }}"

  deploy-web:
    runs-on: ubuntu-latest
    needs: deploy-api
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Configure Artifact Registry
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Resolve API URL
        id: api-url
        run: |
          API_URL="$(gcloud run services describe "${API_SERVICE}" --region "${REGION}" --project "${PROJECT_ID}" --format='value(status.url)')"
          echo "url=${API_URL}" >> "${GITHUB_OUTPUT}"

      - name: Build and push Recruiter Web
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${GAR_REPOSITORY}/${WEB_SERVICE}:${GITHUB_SHA}"
          docker build --build-arg NEXT_PUBLIC_API_URL="${{ steps.api-url.outputs.url }}" -t "${IMAGE}" apps/recruiter-web
          docker push "${IMAGE}"

      - id: deploy
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: ${{ env.WEB_SERVICE }}
          region: ${{ env.REGION }}
          project_id: ${{ env.PROJECT_ID }}
          image: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/${{ env.WEB_SERVICE }}:${{ github.sha }}
          flags: >-
            --service-account=medlivo-recruit-web-01@medlivo-ai-platform.iam.gserviceaccount.com
            --set-env-vars=NEXT_PUBLIC_API_URL=${{ steps.api-url.outputs.url }}

      - name: Show Recruiter Web URL
        run: echo "${{ steps.deploy.outputs.url }}"
