name: Test private team workspace
on:
  pull_request:
    paths:
      - 'services/team-workspace/**'
      - 'services/job-intelligence/**'
      - 'services/margin-engine/**'
      - '.github/workflows/team-workspace-tests.yml'
  push:
    branches: [main]
    paths:
      - 'services/team-workspace/**'
      - 'services/job-intelligence/**'
      - 'services/margin-engine/**'
      - '.github/workflows/team-workspace-tests.yml'
permissions:
  contents: read
jobs:
  sqlite:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ['3.12', '3.13']
    defaults:
      run:
        working-directory: services/team-workspace
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install '../job-intelligence' '../margin-engine' '.[test]'
      - run: python -m pytest -q
      - run: python -m compileall -q workspace_api
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: workspace_ci
          POSTGRES_USER: workspace_ci
          POSTGRES_PASSWORD: ephemeral-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: services/team-workspace
    env:
      WORKSPACE_TEST_DATABASE_URL: postgresql+psycopg://workspace_ci:ephemeral-ci-only@localhost:5432/workspace_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install '../job-intelligence' '../margin-engine' '.[test]'
      - run: python -m pytest -q
