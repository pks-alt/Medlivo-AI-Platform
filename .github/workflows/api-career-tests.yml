name: Test public Career Jobs API
on:
  pull_request:
    paths:
      - 'apps/api/**'
      - '.github/workflows/api-career-tests.yml'
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - '.github/workflows/api-career-tests.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install API tests
        run: python -m pip install '.[test]'
      - name: Run Career API tests
        env:
          USE_MOCK_DATA: 'true'
        run: python -m pytest -q
