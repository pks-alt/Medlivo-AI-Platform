name: Test Job Intelligence

on:
  pull_request:
    paths:
      - "services/job-intelligence/**"
      - ".github/workflows/job-intelligence-tests.yml"
  push:
    branches:
      - "feat/private-team-workspace-20261005"
    paths:
      - "services/job-intelligence/**"
      - ".github/workflows/job-intelligence-tests.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: services/job-intelligence
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Job Intelligence tests
        run: python -m pip install --disable-pip-version-check ".[test]"
      - name: Run normalization tests
        run: pytest -q
