name: Validate platform control layer

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  platform-control:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Validate canonical platform controls
        run: python3 scripts/check_platform_control.py
