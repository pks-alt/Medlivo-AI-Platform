function render(){const {parts,query}=route(),view=parts[0];let content='';try{content=view==='today'?today():view==='jobs'?(parts[1]?jobView(parts[1]):jobsView()):view==='candidates'?(parts[1]?candidateView(parts[1],query):candidatesView()):view==='customers'?customers(parts[1]):view==='submissions'?submissions():view==='conversations'?conversations():view==='followups'?followups():view==='manager'?manager():view==='settings'?settings():view==='search'?searchView(query):empty('Page not found','Choose a workspace section.',link('Today','today','button primary'));}catch(err){content=empty('This view could not be rendered','Reset the sample workspace in Settings to restore the fixtures.',link('Settings','settings','button primary'));console.error('Demo view rendering failed:',err.message);}
 const nav=[['today','Today'],['jobs','Jobs'],['candidates','Candidates'],['customers','Customers'],['conversations','Conversations'],['submissions','Submissions'],['followups','Follow-ups'],['manager','Manager'],['settings','Settings']];const title=nav.find(n=>n[0]===view)?.[1]||'Search';
 $('#app').innerHTML=`<div class="app-shell"><aside class="sidebar"><a href="#today" class="brand" aria-label="Medlivo Recruit AI home"><span class="brand-word">Medlivo<span class="brand-dot"></span></span><span>RECRUIT AI</span></a><p class="nav-heading">WORKSPACE</p><nav aria-label="Main navigation">${nav.map(([id,name])=>`<a href="#${id}" class="nav-item ${view===id?'active':''}" ${view===id?'aria-current="page"':''}>${icon(id==='followups'?'clock':id)}<span>${name}</span>${id==='conversations'&&state.drafts.length?`<small>${state.drafts.length}</small>`:''}</a>`).join('')}</nav><div class="sidebar-bottom"><div class="connection-pill"><span></span>Sample workspace</div><p>JobDiva disconnected.<br>No live candidate data.</p><button data-action="walkthrough" class="help-link">Take the walkthrough ${icon('arrow',14)}</button></div></aside><div class="main-shell"><div class="demo-banner"><span><strong>SAMPLE MODE</strong> Fictional records. No messages or submissions sent.</span><span>${memoryOnly?'Memory only: browser storage unavailable':'Actions saved in this browser only'}</span></div><header class="topbar"><div><p class="eyebrow">RECRUITER COMMAND CENTER</p><h1>${esc(title)}</h1></div><div class="header-actions"><form id="global-search" class="global-search" role="search">${icon('search',18)}<input name="q" placeholder="Search your workspace" aria-label="Search your workspace" autocomplete="off"><button aria-label="Search" type="submit">${icon('arrow',17)}</button></form><label class="persona"><span>Demo persona</span><select id="persona" aria-label="Demo persona">${state.users.map(u=>`<option value="${u.id}" ${u.id===actor?'selected':''}>${esc(u.name)} · ${u.role==='manager'?'Manager':u.division}</option>`).join('')}</select></label></div></header><main id="main" tabindex="-1">${content}</main><footer class="app-footer"><span>Medlivo Recruit AI · Independent workflow preview</span><span>Scenario: Oct 5, 2026 · ${esc(profile().division)} · No real data</span></footer></div></div>`;
 document.title=`${title} | Medlivo Recruit AI · Sample workspace`;
}
function openDialog(title,body,form='',submitLabel='Save sample change'){
 const d=$('#dialog');d.innerHTML=`<div class="dialog-heading"><div><p class="eyebrow">SAMPLE WORKSPACE</p><h2 id="dialog-title">${esc(title)}</h2></div><button class="icon-button" data-action="close-dialog" aria-label="Close dialog">${icon('close')}</button></div><form id="modal-form" data-kind="${esc(form)}">${body}<p id="form-error" class="form-error" role="alert"></p><div class="dialog-footer">${form?'<button type="submit" class="button primary">'+esc(submitLabel)+'</button>':''}<button type="button" class="button secondary" data-action="close-dialog">${form?'Cancel':'Close'}</button></div></form>`;d.showModal();
}
const hidden=(key,value)=>`<input type="hidden" name="${key}" value="${esc(value)}">`;
const textarea=(label,name,value='',max=1200)=>`<label class="field">${esc(label)}<textarea name="${name}" required minlength="3" maxlength="${max}" rows="5" placeholder="Use sample text only">${esc(value)}</textarea></label>`;
function modal(kind,data){
 if(kind==='open-note')openDialog('Add a recruiter note',hidden('candidateId',data.candidate)+textarea('Sample note','text'),'note');
 else if(kind==='open-draft'){
  const c=state.candidates.find(x=>x.id===data.candidate),j=jobBy(data.job);const channel=data.channel||'email',gate=E.outreachGate(state,j.id,c.id,actor,channel),draft=state.drafts.find(x=>x.jobId===j.id&&x.candidateId===c.id&&x.channel===channel);const value=draft?.versions[draft.versions.length-1].text||E.template(state,j.id,c.id,actor);
  openDialog('Prepare outreach',`<p>To ${esc(c.name)} · ${esc(j.title)}</p><div class="notice ${gate.allowed?'blue':'amber'}">${gate.allowed?'This is a draft only. No message will be sent.':esc(gate.reasons.join(' '))}</div>${hidden('jobId',j.id)}${hidden('candidateId',c.id)}<label class="field">Channel<select name="channel"><option value="email" ${channel==='email'?'selected':''}>Email draft</option><option value="sms" ${channel==='sms'?'selected':''}>SMS draft</option></select></label>${textarea('Message for recruiter review','text',value,2000)}<p class="footnote">Changing the channel rechecks consent on save. No email addresses or phone numbers are stored.</p>`,'draft','Save draft only');
 }
 else if(kind==='open-followup')openDialog('Plan a follow-up',hidden('jobId',data.job)+hidden('candidateId',data.candidate)+`<label class="field">Follow-up date<input name="date" type="date" required min="${E.AS_OF}" value="${E.dateAdd(E.AS_OF,1)}"></label>`+textarea('Sample next step','text','',240)+'<div class="notice">This creates a local task, not an email, calendar event or scheduled notification.</div>','followup');
 else if(kind==='open-decision')openDialog(data.stage==='Rejected'?'Reject this sample match':'Place this review on hold',hidden('id',data.id)+hidden('stage',data.stage)+textarea('Reason for the decision','reason','',500),'stage');
 else if(kind==='open-suppress')openDialog('Record do not contact',hidden('candidateId',data.candidate)+textarea('Reason for suppression','reason','',500)+'<div class="notice amber">This blocks new drafts and puts existing sample approvals on hold. Re-enabling contact is deliberately not supported.</div>','suppress','Record suppression');
 else if(kind==='open-reassign')openDialog('Reassign ownership',hidden('id',data.id)+hidden('entity',data.entity)+`<label class="field">New owner<select name="owner">${state.users.filter(u=>u.role==='recruiter').map(u=>`<option value="${u.id}">${esc(u.name+' · '+u.division)}</option>`).join('')}</select></label>`+textarea('Reason for reassignment','reason','',500),'reassign');
 else if(kind==='packet')openDialog('Submission packet preview',`<div class="notice amber">Synthetic review packet. Nothing has been submitted.</div><pre class="packet">${esc(E.packetText(state,data.id))}</pre>${button('Export sample packet (.txt)','export-packet',{id:data.id})}`);
 else if(kind==='walkthrough')openDialog('Try the complete recruiter flow',`<p>No JobDiva connection or credentials are needed.</p><ol class="walkthrough"><li>Choose <strong>Alex Chen</strong> as the demo persona.</li><li>Open <strong>Today → Review queue</strong>, then Jamie Sullivan’s qualification.</li><li>Complete the sample <strong>References reviewed</strong> checkbox.</li><li>Select <strong>Mark ready for review</strong>, then <strong>Approve sample packet</strong>.</li><li>Preview or export the packet. It is not sent anywhere.</li><li>Try a missing-license or do-not-contact profile to see the safeguards.</li><li>Switch to <strong>Dana Reed</strong> to test team ownership and the local activity log.</li></ol><div class="notice">All names, records and evidence are fictional. Enter sample text only. The persona selector is not a production login.</div>`);
 else if(kind==='open-reset')openDialog('Reset this sample workspace?',`<p>This clears demo notes, tasks, drafts, decisions, and ownership changes saved in this browser. Other browser data is not changed.</p>`,'reset','Reset sample data');
}
document.addEventListener('click',event=>{
 const element=event.target.closest('[data-action]');if(!element)return;const {action,...data}=element.dataset;
 if(action==='skip-focus'){event.preventDefault();$('#main')?.focus();}
 else if(action==='close-dialog')$('#dialog').close();
 else if(action==='filter'){filter=data.value;render();}
 else if(action==='shortlist')act({type:'shortlist',jobId:data.job,candidateId:data.candidate});
 else if(action==='stage')act({type:'stage',id:data.id,stage:data.stage});
 else if(action==='completeTask')act({type:'completeTask',id:data.id});
 else if(action==='persona'){actor=data.id;try{localStorage.setItem(KEY+'-actor',actor);}catch{}navigate('manager');render();}
 else if(action==='export-packet'){const blob=new Blob([E.packetText(state,data.id)],{type:'text/plain;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='SAMPLE-Medlivo-'+data.id+'.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Synthetic packet exported. Not submitted.');}
 else modal(action,data);
});
document.addEventListener('change',event=>{const el=event.target;
 if(el.id==='persona'){actor=el.value;try{localStorage.setItem(KEY+'-actor',actor);}catch{}filter='All';search='';render();toast('Demo persona changed. This is not a production login.');}
 if(el.id==='candidate-job')navigate('candidates/'+el.dataset.candidate+'?job='+el.value);
 if(el.matches('input[data-check]'))act({type:'check',id:el.dataset.pipeline,check:el.dataset.check,value:el.checked});
});
document.addEventListener('input',event=>{if(event.target.id==='list-search'){const el=event.target,position=el.selectionStart;search=el.value;render();const next=$('#list-search');next?.focus();try{next?.setSelectionRange(position,position);}catch{}}});
document.addEventListener('submit',event=>{
 if(event.target.getAttribute('id')==='global-search'){event.preventDefault();const q=String(new FormData(event.target).get('q')||'').trim().slice(0,100);if(q)navigate('search?q='+encodeURIComponent(q));return;}
 if(event.target.getAttribute('id')!=='modal-form')return;event.preventDefault();const data=Object.fromEntries(new FormData(event.target));const kind=event.target.dataset.kind;
 if(kind==='reset'){try{localStorage.removeItem(KEY);localStorage.removeItem(KEY+'-actor');}catch{}state=E.clone(SEED);actor='demo-rehab';filter='All';search='';$('#dialog').close();navigate('today');render();toast('The original sample workspace has been restored.');return;}
 if(!kind)return;
 if(act({type:kind,...data}))$('#dialog').close();else $('#form-error').textContent=$('#toast').textContent;
});
window.addEventListener('hashchange',()=>{filter='All';search='';render();$('#main')?.focus({preventScroll:true});window.scrollTo(0,0);});
window.addEventListener('storage',event=>{if(event.key===KEY){if(event.newValue){try{state=E.validateStored(JSON.parse(event.newValue),SEED);}catch{toast('Another tab contains invalid saved data; reload or reset the sample workspace.');return;}}else state=E.clone(SEED);render();toast('Sample workspace refreshed from another tab.');}});
render();if(startupMessage)toast(startupMessage);
})();
</script></body></html>
