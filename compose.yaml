services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: medlivo_ai
      POSTGRES_USER: medlivo
      POSTGRES_PASSWORD: medlivo
    ports:
      - "5432:5432"
    volumes:
      - medlivo_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medlivo -d medlivo_ai"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  medlivo_postgres:
