[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "medlivo-team-workspace"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.128.2,<1",
  "uvicorn>=0.30,<1",
  "pydantic-settings>=2.8,<3",
  "SQLAlchemy>=2.0.50,<2.1",
  "psycopg[binary]>=3.2,<4",
  "PyJWT[crypto]>=2.13,<3",
  "openpyxl>=3.1.5,<4",
  "python-multipart>=0.0.20,<1",
  "google-genai>=1,<2",
  "google-cloud-storage>=3,<4",
  "reportlab>=4,<5",
  "pypdf>=6,<7",
  "Pillow>=11,<13",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.28,<1"]

[tool.setuptools.packages.find]
include = ["workspace_api*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
