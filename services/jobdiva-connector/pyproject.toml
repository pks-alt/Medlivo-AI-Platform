[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "medlivo-jobdiva-connector"
version = "0.2.0"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.28,<1.0",
  "pydantic>=2.11,<3.0",
  "pydantic-settings>=2.8,<3.0"
]

[tool.setuptools.packages.find]
include = ["jobdiva_connector*"]
